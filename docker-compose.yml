services:
  vitalsgrid:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitalsgrid
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
